name: Deploy the Second Look page to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["app/second-look/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the runtime and the two models, chunk the models as base64 text
        working-directory: app/second-look
        run: ./build.sh
      - name: Build the static site
        working-directory: app/second-look
        run: python3 build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/second-look/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
