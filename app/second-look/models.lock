# Second Look: every file build.sh fetches, pinned. One line per file: where it goes, its URL, its size in bytes, its sha256.
# A Hugging Face URL names the commit it was read at (resolve/<commit>/...), so a change upstream cannot reach the build.
# The sizes are the ones index.html expects (FILES and VOCAB in the page script): a file of another size breaks the page.
# ./build.sh checks the size and the sha256 of every file it fetches and stops at the first mismatch ("-": not recorded).
# ./build.sh --lock, where huggingface.co is reachable (CI), fetches every file from resolve/main, reads the commit from the
# x-repo-commit header, checks the sizes against the ones below, and rewrites this file with the commits and the sha256.
# The three script and wasm files are npm's (onnxruntime-web 1.17.3, mammoth 1.12.3, served by jsDelivr); their sha256 were
# computed from the npm tarballs on 2026-09-25.
