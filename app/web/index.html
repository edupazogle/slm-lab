<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2A6B" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>SLM Lab</title>
    <meta name="description" content="Small language models that run on your own device. Nothing you type leaves it." />
    <script>
      // Apply a remembered theme before first paint. With no stored choice the page follows the system setting.
      try {
        var t = localStorage.getItem('slm-lab-theme');
        if (t === 'carbon' || t === 'carbonpaper') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="landing"></div>
    <noscript>SLM Lab runs language models in your browser, so it needs JavaScript switched on.</noscript>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
